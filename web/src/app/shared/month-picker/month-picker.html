<div class="month-picker">
  <button
    type="button"
    class="btn btn-ghost btn-icon"
    [attr.aria-label]="'month.previous' | text"
    (click)="selected.previous()"
  >
    <svg
      class="month-arrow"
      aria-hidden="true"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="m15 18-6-6 6-6" />
    </svg>
  </button>
  <p class="month-label" aria-live="polite">{{ label() }}</p>
  <button
    type="button"
    class="btn btn-ghost btn-icon"
    [attr.aria-label]="'month.next' | text"
    (click)="selected.next()"
  >
    <svg
      class="month-arrow"
      aria-hidden="true"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="m9 18 6-6-6-6" />
    </svg>
  </button>
</div>
