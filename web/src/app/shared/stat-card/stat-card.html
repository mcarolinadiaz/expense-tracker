<article
  [class.card]="tone() !== tones.highlight"
  [class.card-inverse]="tone() === tones.highlight"
>
  <h2 class="stat-label">{{ label() }}</h2>
  <p
    class="stat-value"
    [class.amount-income]="tone() === tones.income"
    [class.amount-expense]="tone() === tones.expense"
  >
    {{ amount() | money: currency() }}
  </p>
</article>
