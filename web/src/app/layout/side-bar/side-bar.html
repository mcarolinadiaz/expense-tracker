<nav [attr.aria-label]="'mainNavigation' | text" class="side-bar">
  <p class="brand">
    <img ngSrc="icons/sloth-mascot.svg" alt="" width="63" height="60" priority />
    <span>{{ 'appName' | text }}</span>
  </p>

  <ul class="nav-list">
    @for (link of links; track link.path) {
      <li>
        <a
          [routerLink]="link.path"
          routerLinkActive="nav-link-active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          ariaCurrentWhenActive="page"
          class="nav-link"
        >
          {{ link.label | text }}
        </a>
      </li>
    }
  </ul>

  <div class="segmented language-picker" role="group" [attr.aria-label]="'language' | text">
    @for (locale of locales; track locale) {
      <button
        type="button"
        class="segmented-item"
        [attr.lang]="locale"
        [attr.aria-pressed]="language() === locale"
        (click)="chooseLanguage(locale)"
      >
        {{ languageNames[locale] }}
      </button>
    }
  </div>
</nav>
